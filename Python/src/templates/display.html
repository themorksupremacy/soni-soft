<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Stats - Full Screen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;

        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .left,
        .right {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            min-height: 0;

        }

        .control-panel {
            flex: 0 0 auto;
            padding: 10px;
            background: #0a0a0a;
            border: 2px solid #004400;
            box-shadow: inset 0 0 10px #002200;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .control-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            border-bottom: 1px solid #004400;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        button,
        input {
            accent-color: #00ff00;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            width: 100%;
        }

        button:hover {
            background: #002200;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        canvas {
            background-color: #050505;
            filter: drop-shadow(0 0 2px rgba(0, 255, 0, 0.4));
            border: 1px solid #002200;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="left">
            <div class="control-panel">
                <h2>Control Panel</h2>
                <div style="margin-bottom: 10px;">
                    <label for="delaySlider">Delay: <span id="delayValue">{{ delay }}</span></label>
                    <input type="range" id="delaySlider" min="0.01" max="1.0" step="0.01" value="{{ delay }}">
                </div>
                <div class="controls-grid">
                    <button id="btnStart">START</button>
                    <button id="btnStop">STOP</button>
                    <button id="btnSpectrogram">DOWNLOAD</button>
                    <button id="btnPlayAudification">PLAY AUDIFICATION</button>
                </div>
                <audio id="audioPlayer">
                    <source id="audioSource" src="/get_audification" type="audio/wav">
                </audio>
            </div>

            <div class="chart-container"><canvas id="kurtChart"></canvas></div>
            <div class="chart-container"><canvas id="magChart"></canvas></div>
        </div>

        <div class="right">
            <div class="chart-container"><canvas id="skewChart"></canvas></div>
            <div class="chart-container"><canvas id="stdChart"></canvas></div>
            <div class="chart-container"><canvas id="meanChart"></canvas></div>
        </div>
    </div>

    <script>
        function createChart(canvasId, label, color, xAxis, yMin, yMax) {
            return new Chart(document.getElementById(canvasId), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        borderWidth: 2,
                        tension: 0.2,
                        pointRadius: 0
                    }]
                },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            display: xAxis,
                            grid: { color: '#111' },
                            title: xAxis ? { display: true, text: "Time", color: '#00ff00' } : undefined
                        },
                        y: {
                            grid: { color: '#111' },
                            title: { display: true, text: label, color: color, font: { size: 10 } },
                            min: yMin,
                            max: yMax
                        }
                    }
                }
            });
        }

        const meanChart = createChart("meanChart", "Mean", "lime", false, 50, 105);
        const skewChart = createChart("skewChart", "Skew", "cyan", false, -1, 1);
        const stdChart = createChart("stdChart", "Std", "orange", false, 50, 127);
        const kurtChart = createChart("kurtChart", "Kurtosis", "magenta", false, 50, 127);
        const magChart = createChart("magChart", "Magnitude", "lime", true, 0, 1);

        const socket = io();
        let t = 0;

        function updateChart(chart, value) {
            chart.data.labels.push(t);
            chart.data.datasets[0].data.push(value);

            if (chart.data.labels.length > 100) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        socket.on('rolling_stats', function (stats) {
            updateChart(meanChart, stats.mean);
            updateChart(skewChart, stats.skew);
            updateChart(stdChart, stats.std);
            updateChart(kurtChart, stats.kurtosis);
            updateChart(magChart, stats.magnitude);
            t++;
        });

        const delaySlider = document.getElementById("delaySlider");
        const delayValue = document.getElementById("delayValue");

        delaySlider.addEventListener("input", function () {
            delayValue.textContent = this.value;
            socket.emit("update_delay", { delay: parseFloat(this.value) });
        });

        document.getElementById("btnStop").addEventListener("click", () => socket.emit("stop_sonification"));
        document.getElementById("btnStart").addEventListener("click", () => socket.emit("start_sonification"));
        document.getElementById("btnSpectrogram").addEventListener("click", () => window.location.href = "/download_spectrogram");

        const btnPlayAudio = document.getElementById("btnPlayAudification");
        const audioPlayer = document.getElementById("audioPlayer");

        btnPlayAudio.addEventListener("click", function () {
            audioPlayer.load();
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlayAudio.textContent = "PAUSE AUDIO";
            } else {
                audioPlayer.pause();
                btnPlayAudio.textContent = "PLAY AUDIO";
            }
        });

        audioPlayer.onended = () => btnPlayAudio.textContent = "PLAY AUDIO";
    </script>
</body>

</html>
