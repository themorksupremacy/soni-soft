<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Stats</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            /* Circular CRT screen vignette */
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .control-panel {
            padding: 15px;
            background: #0a0a0a;
            border: 2px solid #004400;
            box-shadow: inset 0 0 10px #002200;
            text-transform: uppercase;
        }

        button,
        input {
            accent-color: #00ff00;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px;
            cursor: pointer;
        }

        canvas {
            background-color: #050505;
            /* The Glow Effect */
            filter: drop-shadow(0 0 2px rgba(0, 255, 0, 0.5));
            border: 1px solid #002200;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="left">
            <div class="control-panel">
                <h2>Control Panel</h2>
                <div>
                    <label for="delaySlider">Playback Delay:</label>
                    <input type="range" id="delaySlider" min="0.01" max="1.0" step="0.01" value="{{ delay }}">
                    <span id="delayValue">{{ delay }}</span>
                </div>
                <div>
                    <button id="btnStop">Stop Sonification</button>
                </div>
                <div>
                    <button id="btnSpectrogram">Download Spectrogram</button>
                </div>
                <div>
                    <button id="btnPlayAudification">Play Audification</button>
                    <audio id="audioPlayer">
                        <source id="audioSource" src="/get_audification" type="audio/wav">
                    </audio>
                </div>
            </div>
            <canvas id="kurtChart"></canvas>

            <canvas id="magChart"></canvas>
        </div>

        <div class="right">
            <canvas id="skewChart"></canvas>
            <canvas id="stdChart"></canvas>
            <canvas id="meanChart"></canvas>
        </div>
    </div>

    <script>
        function createChart(canvasId, label, color, xAxis, yMin, yMax) {
            return new Chart(document.getElementById(canvasId), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        borderWidth: 2,
                        tension: 0.2,
                        pointRadius: 0
                    }]
                },
                options: {
                    animation: false,
                    responsive: true,
                    scales: {
                        x: {
                            display: xAxis,
                            title: xAxis ? { display: true, text: "Time" } : undefined
                        },
                        y: {
                            title: { display: true, text: label },
                            min: yMin, // will be set dynamically
                            max: yMax
                        }
                    }
                }
            });
        }

        const meanChart = createChart("meanChart", "Mean", "lime", false, 50, 105);
        const skewChart = createChart("skewChart", "Skew", "cyan", false, -1, 1);
        const stdChart = createChart("stdChart", "Std", "orange", false, 50, 127);
        const kurtChart = createChart("kurtChart", "Kurtosis", "magenta", false, 50, 127);
        const magChart = createChart("magChart", "Magnitude", "lime", true, 0, 1);

        const charts = [meanChart, skewChart, stdChart, kurtChart, magChart];

        const socket = io();
        let t = 0;

        function updateChart(chart, value) {
            chart.data.labels.push(t);
            chart.data.datasets[0].data.push(value);

            if (chart.data.labels.length > 100) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }

            chart.update();
        }

        socket.on('rolling_stats', function (stats) {
            updateChart(meanChart, stats.mean);
            updateChart(skewChart, stats.skew);
            updateChart(stdChart, stats.std);
            updateChart(kurtChart, stats.kurtosis);
            updateChart(magChart, stats.magnitude);
            t++;
        });

        const delaySlider = document.getElementById("delaySlider");
        const delayValue = document.getElementById("delayValue");

        delaySlider.addEventListener("input", function () {
            delayValue.textContent = this.value;
            socket.emit("update_delay", { delay: parseFloat(this.value) });
        });

        const btnStop = document.getElementById("btnStop");
        btnStop.addEventListener("click", function () {
            socket.emit("stop_sonification");
        });

        const btnSpectrogram = document.getElementById("btnSpectrogram");
        document.getElementById("btnSpectrogram").addEventListener("click", function () {
            window.location.href = "/download_spectrogram";
        });

        const btnPlayAudio = document.getElementById("btnPlayAudification");
        const audioPlayer = document.getElementById("audioPlayer");

        btnPlayAudio.addEventListener("click", function () {

            audioPlayer.load();

            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlayAudio.textContent = "Pause Audification";
            } else {
                audioPlayer.pause();
                btnPlayAudio.textContent = "Play Audification";
            }
        });

        audioPlayer.onended = function () {
            btnPlayAudio.textContent = "Play Audification";
        };
    </script>
</body>

</html>
